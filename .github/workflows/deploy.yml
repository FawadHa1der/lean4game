# CD: pushes to wasm64-port redeploy the app shell to Cloudflare Workers
# (seconds, ~127 MB of static files): one Worker version with the shell, the
# release record it bundles and the site's two indexes (wasm/DEPLOY.md, "Deploy,
# in order"). Artifacts (multi-GB in R2) are uploaded manually when the release
# record or a snapshot changes: scripts/upload-artifacts.sh BEFORE pushing. It
# changes nothing a deployed shell reads.
# This workflow has no R2 credentials and does not run it, so nothing here checks
# that R2 holds the record's release. The guard in scripts/deploy-app.sh
# (scripts/deploy-guard.mjs) refuses the deploy unless the record, the runtime
# manifest and both indexes pair, and until every .snapz the tracked index names
# answers on the live origin. The deploy job runs only after the test job has
# passed, and deploys only when the repo has the CLOUDFLARE_API_TOKEN secret
# (Workers Scripts: Edit — no R2 permission needed) and CLOUDFLARE_ACCOUNT_ID.
# The test job needs no secrets.
name: deploy
on:
  push:
    branches: [wasm64-port]
  workflow_dispatch:
# One deploy at a time: a run waits for the deploy before it, and a newer run
# replaces one still waiting, so deploys land in push order. A running deploy
# is never cancelled midway. Per ref: a run on another branch deploys nothing and
# must not replace wasm64-port's waiting run. A re-run of an older wasm64-port run
# still can: if the head's run shows cancelled, re-run it.
concurrency:
  group: lean4game-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/test-all.sh
  deploy:
    needs: test
    # workflow_dispatch runs on whatever branch it is given: only wasm64-port deploys.
    if: github.ref == 'refs/heads/wasm64-port'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: secrets
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.present != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy"
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.present == 'true'
        run: npm ci
      # A re-run of an older run, or one that waited behind a newer push, must
      # not deploy over a newer commit: only the current head of wasm64-port deploys.
      - if: steps.secrets.outputs.present == 'true'
        run: test "$(git ls-remote origin refs/heads/wasm64-port | cut -f1)" = "$GITHUB_SHA" || { echo "deploy refused, $GITHUB_SHA is no longer the head of wasm64-port (the newer head deploys in its own run)" >&2; exit 1; }
      - if: steps.secrets.outputs.present == 'true'
        run: SKIP_BUILD=0 scripts/deploy-app.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A fork's own Worker: the guard's origin. Unset, it asks this site's.
          LEAN4GAME_DEPLOY_ORIGIN: ${{ vars.LEAN4GAME_DEPLOY_ORIGIN }}
