# CD: pushes to wasm64-port redeploy the APP SHELL to Cloudflare Workers
# (seconds, ~25 MB of static files). Artifacts (multi-GB in R2) are uploaded
# manually, in TWO steps around this deploy, when a runtime or snapshot
# actually changes (wasm/DEPLOY.md, "Deploy, in order"; QED64 HARDENING #64):
#   1. scripts/upload-artifacts.sh BEFORE pushing (the .snapz and the
#      per-runtime index copies; the live indexes stay as they are). For a
#      runtime change, a push before it has finished leaves every game boot
#      failing for the whole upload.
#   2. scripts/upload-artifacts.sh --post-deploy as soon as this workflow's
#      deploy step has finished (the mutable indexes). For a runtime change
#      it refuses until the new worker is live; for a same-runtime change it
#      cannot tell, so wait for this job.
# This workflow has no R2 credentials and runs neither; scripts/deploy-app.sh
# logs the reminder for step 2 and annotates the run with it, and its guard
# (scripts/deploy-guard.mjs) refuses the deploy until every .snapz the tracked
# index names answers on the live origin. The deploy job
# runs only after the test job has passed, and deploys only when the repo has
# the CLOUDFLARE_API_TOKEN secret (Workers Scripts: Edit — no R2 permission
# needed) and CLOUDFLARE_ACCOUNT_ID. The test job needs no secrets.
name: deploy
on:
  push:
    branches: [wasm64-port]
  workflow_dispatch:
# One deploy at a time: a run waits for the deploy before it, and a newer run
# replaces one still waiting, so deploys land in push order. A running deploy
# is never cancelled midway.
concurrency:
  group: lean4game-deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/test-all.sh
  deploy:
    needs: test
    # workflow_dispatch runs on whatever branch it is given: only wasm64-port deploys.
    if: github.ref == 'refs/heads/wasm64-port'
    runs-on: ubuntu-latest
    steps:
      - id: secrets
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.present != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy"
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.present == 'true'
        run: npm ci
      # A re-run of an older run, or one that waited behind a newer push, must
      # not deploy over a newer commit: only the current head of wasm64-port deploys.
      - if: steps.secrets.outputs.present == 'true'
        run: test "$(git ls-remote origin refs/heads/wasm64-port | cut -f1)" = "$GITHUB_SHA" || { echo "deploy refused, $GITHUB_SHA is no longer the head of wasm64-port (the newer head deploys in its own run)" >&2; exit 1; }
      - if: steps.secrets.outputs.present == 'true'
        run: SKIP_BUILD=0 scripts/deploy-app.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
