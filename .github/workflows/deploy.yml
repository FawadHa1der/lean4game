# CD: pushes to wasm64-port redeploy the APP SHELL to Cloudflare Workers
# (seconds, ~25 MB of static files). Artifacts (multi-GB in R2) are uploaded
# manually via scripts/upload-artifacts.sh when a runtime or snapshot actually
# changes. Runs only when the repo has the CLOUDFLARE_API_TOKEN secret
# (Workers Scripts: Edit — no R2 permission needed) and CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [wasm64-port]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: secrets
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.present != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy"
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.present == 'true'
        run: npm ci
      - if: steps.secrets.outputs.present == 'true'
        run: node --import ./client/src/wasm/ts-resolve-hook.mjs client/src/wasm/game-translation.test.ts
      - if: steps.secrets.outputs.present == 'true'
        run: SKIP_BUILD=0 scripts/deploy-app.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
